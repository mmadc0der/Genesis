services:
  genesis:
    build:
      context: .
      dockerfile: Dockerfile
    image: genesis:v2
    init: true
    user: "0:0"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GENESIS_SYNC_TOKEN: ${GENESIS_SYNC_TOKEN:-compose-sync-token}
      GENESIS_LISTENER_USER: genesis
    volumes:
      - type: volume
        source: config
        target: /var/lib/genesis/config
      - type: volume
        source: data
        target: /var/lib/genesis/data
      - type: volume
        source: credentials
        target: /var/lib/genesis/credentials
      - type: bind
        source: ./runtime/providers
        target: /etc/genesis/providers.d
      - type: bind
        source: ./runtime/secrets
        target: /var/lib/genesis/secrets

  control:
    image: genesis:v2
    init: true
    user: "65532:65532"
    depends_on:
      - genesis
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ -O /var/lib/genesis/config/agents.d ] && [ -w /var/lib/genesis/config/agents.d ] && [ -x /var/lib/genesis/config/agents.d ] && [ -O /var/lib/genesis/config/rules.d ] && [ -w /var/lib/genesis/config/rules.d ] && [ -x /var/lib/genesis/config/rules.d ] && [ -O /var/lib/genesis/config/repos.d ] && [ -w /var/lib/genesis/config/repos.d ] && [ -x /var/lib/genesis/config/repos.d ] && [ -O /var/lib/genesis/data/runs ] && [ -r /var/lib/genesis/data/runs ] && [ -x /var/lib/genesis/data/runs ]; do
          sleep 0.2
        done
        exec /usr/local/bin/genesis control \
          -listen 0.0.0.0:8792 \
          -listener http://genesis:8787 \
          -agents /var/lib/genesis/config/agents.d \
          -rules /var/lib/genesis/config/rules.d \
          -repos /var/lib/genesis/config/repos.d \
          -providers /etc/genesis/providers.d \
          -data /var/lib/genesis/data \
          -web /usr/share/genesis/web
    ports:
      - "127.0.0.1:8792:8792"
    environment:
      GENESIS_SYNC_TOKEN: ${GENESIS_SYNC_TOKEN:-compose-sync-token}
    volumes:
      - type: volume
        source: config
        target: /var/lib/genesis/config
      - type: volume
        source: data
        target: /var/lib/genesis/data
        read_only: true
      - type: bind
        source: ./runtime/providers
        target: /etc/genesis/providers.d
        read_only: true

volumes:
  config:
    name: genesis-v2-config
  data:
    name: genesis-v2-data
  credentials:
    name: genesis-v2-credentials
